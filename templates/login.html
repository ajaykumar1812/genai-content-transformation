{% extends "base.html" %}

{% block title %}Sign In - Gen AI Platform{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-lg border-0 bg-body-tertiary p-4 p-md-5 rounded-4">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3 d-inline-flex align-items-center justify-content-center shadow-sm">
            <i class="bi bi-shield-lock fs-4"></i>
          </div>
          <h3 class="fw-bold tracking-tight">Welcome Back</h3>
          <p class="text-body-secondary small">Sign in to your Gen AI Workspace</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
          <div class="mb-3">
            <label class="form-label small text-body-secondary fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small text-body-secondary fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
            <span>Sign In</span> <i class="bi bi-arrow-right-short fs-5"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-body-secondary small">Don't have an account yet?</span>
          <a href="{{ url_for('register') }}" class="text-primary text-decoration-none small fw-semibold ms-1">Create Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
