{% extends "base.html" %}

{% block title %}Create Account - Gen AI Platform{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card auth-card shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3 d-inline-flex align-items-center justify-content-center">
            <i class="bi bi-person-plus fs-4"></i>
          </div>
          <h3 class="fw-bold text-white">Create Your Workspace</h3>
          <p class="text-white-50 small">Start transforming documents and content with AI</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label text-white-50 small fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Alex Johnson" value="{{ name or '' }}" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-white-50 small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="alex@company.com" value="{{ email or '' }}" required>
            </div>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-sm-6">
              <label class="form-label text-white-50 small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="Min. 6 chars" minlength="6" required>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="form-label text-white-50 small fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-white-50"><i class="bi bi-shield-check"></i></span>
                <input type="password" name="confirm_password" class="form-control bg-dark text-white border-secondary" placeholder="Repeat password" minlength="6" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <span>Register & Start Creating</span> <i class="bi bi-arrow-right-short fs-5"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <span class="text-white-50 small">Already registered?</span>
          <a href="{{ url_for('login') }}" class="text-primary text-decoration-none small fw-semibold ms-1">Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
